<!DOCTYPE html>
<html lang="ur"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="Sadiq Ahmad"><title>SadCricScorer</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f2418">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SadCricScorer">
<style>
:root{--bg:#0f2418;--pn:#183626;--ln:#2b5239;--tx:#f3f1e8;--mu:#9bb5a2;--ac:#e8c27a;--rd:#d4453a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding-bottom:70px}
#app{padding:12px;max-width:560px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0a1a11;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:14px 0;font-size:13px}
nav button.on{color:var(--ac);font-weight:700}
.c{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:17px}
input,select,textarea{background:#0f2418;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:9px;font-size:15px;max-width:100%}
button{font:inherit;color:var(--tx)}
.b{background:var(--ln);border:0;border-radius:8px;padding:11px 14px}
.b.p{background:var(--ac);color:#1a1a0f;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln);gap:6px}
.row:last-child{border:0}
.tm{background:#0f2418;border:1px solid var(--ln);border-radius:6px;padding:7px 13px;margin-left:5px}
.tm.on{background:var(--ac);color:#111;font-weight:700}
.av{border-radius:50%;background:var(--ln);display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;object-fit:cover;margin-right:8px;font-weight:700;color:var(--ac)}
.big{font-size:38px;font-weight:800;color:var(--ac);line-height:1}
.mu{color:var(--mu);font-size:13px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.g button{background:var(--ln);border:0;border-radius:10px;padding:16px 0;font-size:20px;font-weight:700}
.g .w{background:var(--rd)}.g .x{font-size:14px}.g .on{background:var(--ac);color:#111}
.ch{display:inline-block;min-width:30px;text-align:center;padding:5px 7px;margin:2px;border-radius:15px;background:var(--ln);font-weight:700;font-size:13px}
.ch.o{background:var(--rd)}.ch.f{background:var(--ac);color:#111}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 3px;text-align:right;border-bottom:1px solid var(--ln)}
td:nth-child(2),th:nth-child(2){text-align:left}
th{color:var(--mu);font-weight:500}
.sub{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.sub button{background:var(--pn);border:1px solid var(--ln);border-radius:20px;padding:8px 14px;white-space:nowrap}
.sub button.on{background:var(--ac);color:#111;font-weight:700}
#M{display:none;position:fixed;inset:0;background:#000a;align-items:flex-end;justify-content:center;z-index:9}
.md{background:var(--pn);width:100%;max-width:560px;max-height:75vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px}
.it{display:block;width:100%;text-align:left;background:var(--ln);border:0;border-radius:8px;padding:13px;margin-bottom:6px;font-size:16px}
</style></head><body>
<div id="app"></div><div id="M"></div>
<nav id="tabs"></nav>
<script>
let D;try{D=JSON.parse(localStorage.getItem('cc')||'null')}catch(e){}
D=D||{p:[],m:[]};D.tn=D.tn||[];D.tn.forEach(t=>{if(t.type=='s6'||t.type=='s8'){t.sn=t.type=='s6'?6:8;t.sg=2;t.kk=4;t.type='sp'}});D.tn.forEach(t=>{if(t.type=='s6'||t.type=='s8'){t.type='sup';t.sg=2}t.late=t.late||[]});
const save=()=>{try{localStorage.setItem('cc',JSON.stringify(D))}catch(e){}};
const $=s=>document.querySelector(s),M=$('#M');
const uid=()=>Math.random().toString(36).slice(2,9);
const P=id=>D.p.find(x=>x.id==id)||{name:'?'};
const nm=id=>P(id).name;
let tab='match',cm=null,sub='bat',pf=null,nbOn=false;
let T={a:[],b:[],ov:4,lm:true,na:'Team A',nb:'Team B',bf:0};

const av=(id,s)=>{const p=P(id);s=s||32;return p.pic?`<img class=av src="${p.pic}" width=${s} height=${s}>`:`<span class=av style="width:${s}px;height:${s}px;font-size:${s/2.2}px">${(p.name||'?')[0].toUpperCase()}</span>`};
const tot=n=>n.balls.reduce((a,b)=>a+b.r+b.xr,0);
const wk=n=>n.balls.filter(b=>b.out).length;
const lb=n=>n.balls.filter(b=>!b.x).length;
const ovf=n=>Math.floor(lb(n)/6)+'.'+lb(n)%6;
const cur=()=>D.m.find(m=>m.id==cm);
const bat=(m,n)=>m.t[n.bat].pl, fld=(m,n)=>{const f=m.t[1-n.bat].pl;return f.length?f:bat(m,n)};
const bs=(n,id)=>{let r=0,f=0,o=0;n.balls.forEach(b=>{if(b.bt==id){r+=b.r;if(b.x!=='w')f++;if(b.out)o=1}});return{r,f,o}};
const bw=(n,id)=>{let b=0,r=0,w=0;n.balls.forEach(x=>{if(x.bl==id){r+=x.r+x.xr;if(!x.x)b++;if(x.out&&!x.ro)w++}});return{b,r,w,o:Math.floor(b/6)+'.'+b%6}};


/* ---------- EXTRAS ---------- */
function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#e8c27a;color:#111;padding:10px 14px;border-radius:8px;z-index:20;font-weight:600;max-width:90%;text-align:center';document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
function win(m){if(!m.done)return null;const a=tot(m.inn[0]),b=tot(m.inn[1]);return a==b?-1:b>a?m.inn[1].bat:m.inn[0].bat}
function parts(n){const L=[];let r=0,b=0;n.balls.forEach(x=>{r+=x.r+x.xr;if(!x.x)b++;if(x.out){L.push({r,b,a:x.bt,c:x.ns});r=0;b=0}});return{L,cur:{r,b}}}
function pHtml(n){const p=parts(n),L=p.L.slice();if(p.cur.r&&n.s&&n.n)L.push({r:p.cur.r,b:p.cur.b,a:n.s,c:n.n,u:1});if(!L.length)return '';
 return `<div class=mu style="margin:8px 0 2px">Partnerships</div>`+L.map((x,k)=>`<div class=row><span>${k+1}wkt: ${nm(x.a)} & ${x.c?nm(x.c):'-'}${x.u?'*':''}</span><span>${x.r} (${x.b})</span></div>`).join('')}
function pickM(t,l,f){M.innerHTML=`<div class=md><h3>${t}</h3>${l.map((id,i)=>`<button class=it onclick="PK(${i})">${av(id,28)}${nm(id)}</button>`).join('')}<button class=it onclick="PK(-1)">Raddi</button></div>`;M.style.display='flex';window.PK=i=>{M.style.display='none';if(i>=0)f(l[i]);save();render()}}
function retire(){
 const m=cur(),n=m.inn[m.inn.length-1];if(n.ended||!n.s)return;
 const outs=n.balls.filter(b=>b.out).map(b=>b.bt),a=bat(m,n).filter(id=>!outs.includes(id)&&id!=n.s&&id!=n.n);
 if(!a.length)return toast('Badalne ke liye koi aur batsman nahi');
 pickM('Kaun retire ho raha hai?',[n.s,n.n].filter(Boolean),x=>pickM('Uski jagah kaun aaye?',a,y=>{if(x==n.s)n.s=y;else n.n=y}));
}
function shareImg(id){
 const m=D.m.find(x=>x.id==id),R=[];
 R.push(['t',m.t[0].n+' vs '+m.t[1].n]);R.push(['m',(m.res||'Match jari hai')+' · '+m.ov+' overs · '+new Date(m.d).toLocaleDateString()]);
 m.inn.forEach(n=>{
  R.push(['h',m.t[n.bat].n+': '+tot(n)+'/'+wk(n)+' ('+ovf(n)+')']);
  const ids=[];n.balls.forEach(b=>{[b.ns,b.bt].forEach(q=>q&&!ids.includes(q)&&ids.push(q))});
  ids.forEach(i=>{const s=bs(n,i);R.push(['r',nm(i)+(s.o?'':'*'),s.r+' ('+s.f+')'])});
  const bo=[];n.balls.forEach(b=>!bo.includes(b.bl)&&bo.push(b.bl));
  R.push(['m','Bowling']);bo.forEach(i=>{const s=bw(n,i);R.push(['r',nm(i),s.o+'-'+s.r+'-'+s.w])});
  const p=parts(n);if(p.L.length){R.push(['m','Partnerships']);p.L.forEach((q,k)=>R.push(['r',(k+1)+'wkt '+nm(q.a)+' & '+(q.c?nm(q.c):'-'),q.r+' ('+q.b+')']))}
 });
 R.push(['f','Scored with SadCricScorer · Sadiq Ahmad']);
 const W=720,H=R.length*42+50,c=document.createElement('canvas');c.width=W;c.height=H;const cx=c.getContext('2d');
 cx.fillStyle='#0f2418';cx.fillRect(0,0,W,H);let y=50;
 R.forEach(([k,a,b])=>{
  cx.fillStyle=k=='t'||k=='h'?'#e8c27a':k=='m'||k=='f'?'#9bb5a2':'#f3f1e8';
  cx.font=(k=='t'?'bold 30px':k=='h'?'bold 24px':k=='r'?'22px':'20px')+' sans-serif';
  cx.textAlign='left';cx.fillText(a,24,y);if(b){cx.textAlign='right';cx.fillText(b,W-24,y)}
  y+=k=='h'?46:40;
 });
 c.toBlob(bl=>{const f=new File([bl],'scorecard.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:'Scorecard'}).catch(()=>{});
  else{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='scorecard.png';a.click();toast('Image save ho gayi')}
 });
}


/* ---------- TOURNAMENT ---------- */
let ctn=null,tsub='fx',T2={name:'',type:'ko',ov:4,sz:6,lm:true,g:1,sn:6,sg:2,kk:4,teams:''};
const TY={ko:'Knockout',sp:'Super stage (apni marzi)'},GL='ABCD';
const DESC={ko:'Jo team haare woh bahar. Aakhir mein Final. Teams kisi bhi waqt add ho sakti hain.',sp:'League (groups) → Super stage (teams ki tadaad aap chunein) → Semi Final → Final. Super stage 0 rakhein to League ke baad seedha Semi/Final.'};
const SN=tn=>'Super '+tn.sn;
const tname=tn=>tn.type=='ko'?'Knockout':tn.sn>0?'Super '+tn.sn+' · '+tn.g+' group league':'League → Knockout';
const gids=(tn,k)=>[...new Set(tn.fx.filter(f=>f.st=='League'&&f.gp==k).flatMap(f=>[f.a,f.b]))];
const tm=(tn,id)=>tn.teams.find(t=>t.id==id)||{n:'?',pl:[]};
const kn=c=>c==2?'Final':c<=4?'Semi Final':c<=8?'Quarter Final':'Round of '+c;
const snk=(i,g)=>{const r=Math.floor(i/g),k=i%g;return r%2?g-1-k:k};
function back(){const m=cur();if(m&&m.tn){tab='tn';ctn=m.tn}cm=null;render()}
function openM(id){tab='match';cm=id;render()}
function rr(tn,ids,st,gp){for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)tn.fx.push({id:uid(),a:ids[i],b:ids[j],st,gp})}
function koRound(tn,ids){const st=kn(ids.length);tn.cs=st;let i=0;if(ids.length%2){tn.fx.push({id:uid(),a:ids[0],b:null,st,ko:1,bye:1});i=1}for(;i<ids.length;i+=2)tn.fx.push({id:uid(),a:ids[i],b:ids[i+1],st,ko:1})}
function fres(tn,f){if(f.bye)return f.a;const m=D.m.find(x=>x.id==f.mid);if(!m||!m.done)return null;const w=win(m);
 if(w==-1){if(f.ko)return m.tw!=null?m.t[m.tw].tid:null;return 'tie'}return m.t[w].tid}
function stand(tn,st,gp){
 const fs=tn.fx.filter(f=>f.st==st&&f.gp==gp&&!f.bye),R={};
 fs.forEach(f=>[f.a,f.b].forEach(id=>R[id]||(R[id]={id,P:0,W:0,L:0,T:0,Pts:0,rf:0,bf:0,ra:0,ba:0})));
 fs.forEach(f=>{const m=D.m.find(x=>x.id==f.mid);if(!m||!m.done)return;
  m.inn.forEach(n=>{const a=m.t[n.bat].tid,o=m.t[1-n.bat].tid,bt=m.t[n.bat].pl.length,all=bt>0&&wk(n)>=bt-(m.lm?0:1),b=all?m.ov*6:lb(n);R[a].rf+=tot(n);R[a].bf+=b;R[o].ra+=tot(n);R[o].ba+=b});
  const w=fres(tn,f);R[f.a].P++;R[f.b].P++;
  if(w=='tie'){R[f.a].T++;R[f.b].T++;R[f.a].Pts++;R[f.b].Pts++}
  else if(w){const l=w==f.a?f.b:f.a;R[w].W++;R[w].Pts+=2;R[l].L++}});
 return Object.values(R).map(r=>({...r,nrr:(r.bf?r.rf/(r.bf/6):0)-(r.ba?r.ra/(r.ba/6):0)})).sort((a,b)=>b.Pts-a.Pts||b.nrr-a.nrr||b.W-a.W);
}
function mkTn(){
 const n=T2.teams.split('\n').map(x=>x.trim()).filter(Boolean);
 if(!T2.name.trim())return toast('Tournament ka naam likhein');
 if(n.length<2)return toast('Kam az kam 2 teams likhein (baqi baad mein add ho sakti hain)');
 const sp=T2.type=='sp',g=sp?+T2.g:1,N=sp?Math.max(0,+T2.sn||0):0;
 const tn={id:uid(),name:T2.name.trim(),type:T2.type,ov:+T2.ov||4,sz:+T2.sz||6,lm:T2.lm,g,sn:N,sg:+T2.sg||2,kk:+T2.kk||4,teams:n.map(x=>({id:uid(),n:x,pl:[]})),fx:[]};
 if(!sp)koRound(tn,tn.teams.map(t=>t.id));
 else{tn.cs='League';for(let k=0;k<g;k++)rr(tn,tn.teams.filter((t,i)=>snk(i,g)==k).map(t=>t.id),'League',GL[k])}
 D.tn.push(tn);save();ctn=tn.id;tsub='sq';T2.name='';T2.teams='';render();toast('Ab har team ka squad banayein');
}
const cmpR=(a,b)=>b.Pts-a.Pts||b.nrr-a.nrr||b.W-a.W;
function selTeams(tn,Q){
 const q=Math.floor(Q/tn.g),top=[],rest=[];
 for(let k=0;k<tn.g;k++){const s=stand(tn,'League',GL[k]);s.slice(0,q).forEach(r=>top.push(r));s.slice(q).forEach(r=>rest.push(r))}
 rest.sort(cmpR);while(top.length<Q&&rest.length)top.push(rest.shift());
 return top.sort(cmpR)}
function koSeed(tn,ids){
 const P=ids.length>=4&&tn.kk>=4?[[ids[0],ids[3]],[ids[1],ids[2]]]:[[ids[0],ids[1]]];
 tn.cs=P.length>1?'Semi Final':'Final';P.forEach(p=>tn.fx.push({id:uid(),a:p[0],b:p[1],st:tn.cs,ko:1}))}
function advance(){
 const tn=D.tn.find(x=>x.id==ctn),F=tn.fx.filter(f=>f.st==tn.cs);
 if(!F.length||F.some(f=>fres(tn,f)==null))return toast('Pehle is round ke sab match poore karein');
 const W=F.map(f=>fres(tn,f)),cs=tn.cs;
 if(tn.type=='ko'){const ids=[...W,...(tn.late||[])];tn.late=[];if(ids.length==1){tn.champ=ids[0];tn.cs='Done'}else koRound(tn,ids)}
 else if(cs=='Final'){tn.champ=W[0];tn.cs='Done'}
 else if(cs=='Semi Final'){tn.cs='Final';tn.fx.push({id:uid(),a:W[0],b:W[1],st:'Final',ko:1})}
 else if(cs=='League'){
  const S=selTeams(tn,tn.sn>0?tn.sn:tn.kk);
  if(S.length<2)return toast('Kam az kam 2 teams chahiye');
  if(tn.sn>0){const sg=Math.max(1,Math.min(tn.sg,Math.floor(S.length/2)));tn.sga=sg;tn.cs=SN(tn);
   for(let k=0;k<sg;k++)rr(tn,S.filter((r,i)=>snk(i,sg)==k).map(r=>r.id),tn.cs,GL[k])}
  else koSeed(tn,S.map(r=>r.id));
 }else{
  const sg=tn.sga||2,T=[];for(let k=0;k<sg;k++)T.push(stand(tn,cs,GL[k]));
  const pf=(a,b,st)=>tn.fx.push({id:uid(),a,b,st,ko:1});
  if(sg==2&&tn.kk>=4&&T[0].length>1&&T[1].length>1){tn.cs='Semi Final';pf(T[0][0].id,T[1][1].id,tn.cs);pf(T[1][0].id,T[0][1].id,tn.cs)}
  else if(sg==2){tn.cs='Final';pf(T[0][0].id,T[1][0].id,'Final')}
  else koSeed(tn,T[0].map(r=>r.id));
 }
 save();render();
}
function pickT(t,items,cb){M.innerHTML=`<div class=md><h3>${t}</h3>${items.map((x,i)=>`<button class=it onclick="PT(${i})">${x[1]}</button>`).join('')}<button class=it onclick="PT(-1)">Raddi</button></div>`;M.style.display='flex';window.PT=i=>{M.style.display='none';if(i>=0)cb(items[i][0]);save();render()}}
function mfx(){
 const tn=D.tn.find(x=>x.id==ctn);if(tn.cs=='Done')return;
 pickT('Team A',tn.teams.map(t=>[t.id,t.n]),a=>pickT('Team B',tn.teams.filter(t=>t.id!=a).map(t=>[t.id,t.n]),b=>{
  const grp=tn.type!='ko'&&(tn.cs=='League'||tn.cs==SN(tn)),ko=!grp,gof=id=>{const f=tn.fx.find(f=>f.st==tn.cs&&f.gp&&(f.a==id||f.b==id));return f?f.gp:null};
  const ga=gof(a),gb=gof(b);
  tn.fx.push({id:uid(),a,b,st:tn.cs,gp:grp&&ga&&ga==gb?ga:undefined,ko:ko?1:undefined});toast('Match jud gaya')}));
}
function delFx(fid){if(!confirm('Yeh match hatana hai?'))return;const tn=D.tn.find(x=>x.id==ctn);tn.fx=tn.fx.filter(f=>f.id!=fid||f.mid);save();render()}
function addTeamUI(){
 const tn=D.tn.find(x=>x.id==ctn);if(tn.cs=='Done')return;
 const grp=tn.type=='sp'&&tn.cs=='League'&&tn.g>1;
 M.innerHTML=`<div class=md><h3>Nayi team shamil karein</h3><input id=ntn placeholder="Team ka naam" style="width:100%;margin-bottom:8px">${grp?`<div class=mu>Kis group mein?</div><select id=ntg style="width:100%;margin-bottom:8px">${[...Array(tn.g).keys()].map(k=>`<option value=${k}>Group ${GL[k]} (${gids(tn,GL[k]).length} teams)</option>`).join('')}</select>`:''}<button class="b p" onclick="addTeam()">Add</button> <button class=b onclick="M.style.display='none'">Raddi</button></div>`;M.style.display='flex';
}
function addTeam(){
 const tn=D.tn.find(x=>x.id==ctn),n=$('#ntn').value.trim();if(!n)return toast('Naam likhein');
 const t={id:uid(),n,pl:[]};tn.teams.push(t);let msg;
 if(tn.type=='sp'&&tn.cs=='League'){const gp=GL[$('#ntg')?+$('#ntg').value:0];gids(tn,gp).forEach(o=>tn.fx.push({id:uid(),a:o,b:t.id,st:'League',gp}));msg='Team League mein shamil, fixtures ban gaye'}
 else if(tn.type=='ko'){
  const F=tn.fx.filter(f=>f.st==tn.cs);
  if(F.every(f=>!f.mid)){const ids=F.flatMap(f=>f.b?[f.a,f.b]:[f.a]);tn.fx=tn.fx.filter(f=>f.st!=tn.cs);koRound(tn,[...ids,t.id]);msg='Team is round mein shamil, fixtures dobara bane'}
  else{tn.late=(tn.late||[]).concat(t.id);msg='Round shuru ho chuka hai, team agle round mein shamil hogi'}}
 else msg='Team add ho gayi. "Match jodein" se iske matches banayein';
 save();M.style.display='none';render();toast(msg);
}
function startFx(fid){
 const tn=D.tn.find(x=>x.id==ctn),f=tn.fx.find(x=>x.id==fid),A=tm(tn,f.a),B=tm(tn,f.b);
 if(!A.pl.length||!B.pl.length)return toast('Pehle dono teams ke squad banayein');
 M.innerHTML=`<div class=md><h3>Pehle batting kaun karega?</h3><button class=it onclick="goFx('${fid}',0)">${A.n}</button><button class=it onclick="goFx('${fid}',1)">${B.n}</button><button class=it onclick="M.style.display='none'">Raddi</button></div>`;M.style.display='flex';
}
function goFx(fid,bf){
 M.style.display='none';const tn=D.tn.find(x=>x.id==ctn),f=tn.fx.find(x=>x.id==fid),A=tm(tn,f.a),B=tm(tn,f.b);
 const m={id:uid(),d:Date.now(),ov:tn.ov,lm:tn.lm,tn:tn.id,fx:fid,t:[{n:A.n,pl:[...A.pl],tid:A.id},{n:B.n,pl:[...B.pl],tid:B.id}],inn:[{bat:bf,balls:[],s:null,n:null,bw:null}]};
 D.m.push(m);f.mid=m.id;save();openM(m.id);
}
function tieW(mid){const m=D.m.find(x=>x.id==mid);
 M.innerHTML=`<div class=md><h3>Tie: winner kaun?</h3><button class=it onclick="setTw('${mid}',0)">${m.t[0].n}</button><button class=it onclick="setTw('${mid}',1)">${m.t[1].n}</button></div>`;M.style.display='flex'}

/* ---------- STATS ---------- */
function stats(tid){
 const S={};
 const g=id=>S[id]||(S[id]={id,r:0,bf:0,f4:0,s6:0,out:0,inn:0,hi:0,bb:0,rc:0,w:0,bi:0,best:null,mat:new Set(),W:0,Lo:0,Ti:0,tm:{}});
 D.p.forEach(p=>g(p.id));
 D.m.filter(m=>!tid||m.tn==tid).forEach(m=>{
  m.t.forEach((t,ti)=>t.pl.forEach(id=>{const a=g(id);a.mat.add(m.id);if(m.done){const w=win(m),r=a.tm[t.n]||(a.tm[t.n]={w:0,l:0,t:0});if(w==-1){a.Ti++;r.t++}else if(w==ti){a.W++;r.w++}else{a.Lo++;r.l++}}}));
  m.inn.forEach(n=>{
   const bi={},bo={};
   n.balls.forEach(b=>{
    const a=g(b.bt),x=bi[b.bt]||(bi[b.bt]={r:0});
    x.r+=b.r;a.r+=b.r;if(b.x!=='w')a.bf++;
    if(b.r==4)a.f4++;if(b.r==6)a.s6++;if(b.out)a.out++;
    const y=bo[b.bl]||(bo[b.bl]={w:0,r:0,b:0});
    y.r+=b.r+b.xr;if(!b.x)y.b++;if(b.out&&!b.ro)y.w++;
   });
   for(const id in bi){const a=g(id);a.inn++;a.hi=Math.max(a.hi,bi[id].r)}
   for(const id in bo){const a=g(id),y=bo[id];a.bb+=y.b;a.rc+=y.r;a.w+=y.w;a.bi++;
    if(!a.best||y.w>a.best.w||(y.w==a.best.w&&y.r<a.best.r))a.best=y}
  });
 });
 const L=Object.values(S);
 L.forEach(a=>{a.sr=a.bf?a.r/a.bf*100:0;a.avg=a.out?a.r/a.out:null;a.eco=a.bb?a.rc/(a.bb/6):0;a.bo=a.bb?Math.floor(a.bb/6)+'.'+a.bb%6:'0'});
 return L;
}
const rbat=L=>L.filter(a=>a.inn).sort((a,b)=>b.r-a.r||b.sr-a.sr);
const rbowl=L=>L.filter(a=>a.bb).sort((a,b)=>b.w-a.w||a.eco-b.eco);

function statsV(tid){
 const L=stats(tid);
 const tabs=[['bat','Batting'],['bowl','Bowling'],['s6','Sixes'],['f4','Fours'],['wl','Jeet/Haar']];
 let h=`<div class=sub>${tabs.map(t=>`<button class="${sub==t[0]?'on':''}" onclick="sub='${t[0]}';render()">${t[1]}</button>`).join('')}</div><div class=c>`;
 const row=(a,i,cells)=>`<tr onclick="prof('${a.id}')"><td>${i+1}</td><td>${av(a.id,24)}${nm(a.id)}</td>${cells.map(c=>`<td>${c}</td>`).join('')}</tr>`;
 if(sub=='bat')h+=`<table><tr><th>#</th><th>Player</th><th>Runs</th><th>SR</th><th>Avg</th><th>HS</th></tr>${rbat(L).map((a,i)=>row(a,i,[a.r,a.sr.toFixed(0),a.avg==null?'-':a.avg.toFixed(1),a.hi])).join('')}</table>`;
 if(sub=='bowl')h+=`<table><tr><th>#</th><th>Player</th><th>Wkt</th><th>Ov</th><th>Eco</th><th>Best</th></tr>${rbowl(L).map((a,i)=>row(a,i,[a.w,a.bo,a.eco.toFixed(1),a.best.w+'/'+a.best.r])).join('')}</table>`;
 if(sub=='s6')h+=`<table><tr><th>#</th><th>Player</th><th>6s</th></tr>${L.filter(a=>a.s6).sort((a,b)=>b.s6-a.s6).map((a,i)=>row(a,i,[a.s6])).join('')}</table>`;
 if(sub=='f4')h+=`<table><tr><th>#</th><th>Player</th><th>4s</th></tr>${L.filter(a=>a.f4).sort((a,b)=>b.f4-a.f4).map((a,i)=>row(a,i,[a.f4])).join('')}</table>`;
 if(sub=='wl'){const q=L.filter(a=>a.W+a.Lo+a.Ti).sort((a,b)=>b.W/(b.W+b.Lo+b.Ti)-a.W/(a.W+a.Lo+a.Ti)||b.W-a.W);h+=`<table><tr><th>#</th><th>Player</th><th>Jeet</th><th>Haar</th><th>Tie</th><th>Win%</th></tr>${q.map((a,i)=>row(a,i,[a.W,a.Lo,a.Ti,Math.round(a.W/(a.W+a.Lo+a.Ti)*100)+'%'])).join('')}</table>`}
 return h+`</div><div class=mu>Abhi koi match score nahi hua to yahan khali dikhega.</div>`;
}
function prof(id){
 const L=stats(),a=L.find(x=>x.id==id),rb=rbat(L).findIndex(x=>x.id==id)+1,rw=rbowl(L).findIndex(x=>x.id==id)+1;
 const k=(l,v)=>`<div class=c style="margin:0;text-align:center"><div class=mu>${l}</div><b style="font-size:18px">${v}</b></div>`;
 M.innerHTML=`<div class=md><div style="text-align:center">${av(id,96)}<h3 style="margin-top:8px">${nm(id)}</h3><div class=mu>Matches ${a.mat.size} · Batting rank ${rb||'-'} · Bowling rank ${rw||'-'}</div></div>
 <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0">
 ${k('Runs',a.r)}${k('Strike rate',a.sr.toFixed(1))}${k('Average',a.avg==null?'-':a.avg.toFixed(1))}
 ${k('Highest',a.hi)}${k('Fours',a.f4)}${k('Sixes',a.s6)}
 ${k('Wickets',a.w)}${k('Best figure',a.best?a.best.w+'/'+a.best.r:'-')}${k('Economy',a.bb?a.eco.toFixed(1):'-')}${k('Jeet',a.W)}${k('Haar',a.Lo)}${k('Tie',a.Ti)}</div>
 ${Object.keys(a.tm).length?`<div class=c style="margin:0 0 10px"><h3>Team-wise</h3>${Object.entries(a.tm).map(([t,r])=>`<div class=row><span>${t}</span><span>${r.w} jeet · ${r.l} haar${r.t?' · '+r.t+' tie':''}</span></div>`).join('')}</div>`:''}

function photo(id){const i=document.createElement('input');i.type='file';i.accept='image/*';
 i.onchange=()=>{const f=i.files[0];if(!f)return;const im=new Image();
  im.onload=async()=>{
   let cx=im.width/2,cy=im.height/2,sz=Math.min(im.width,im.height);
   try{if('FaceDetector' in window){const fs=await new FaceDetector({maxDetectedFaces:1}).detect(im);
    if(fs.length){const b=fs[0].boundingBox;cx=b.x+b.width/2;cy=b.y+b.height/2;sz=Math.max(b.width,b.height)*2.2}}}catch(e){}
   cropUI(id,im,cx,cy,sz)};
  im.src=URL.createObjectURL(f)};i.click()}
let CR=null;
function cropUI(id,im,cx,cy,sz){
 const sh=Math.min(im.width,im.height);CR={id,im,cx,cy,sh,pct:Math.max(10,Math.min(100,sz/sh*100))};
 M.innerHTML=`<div class=md style="text-align:center"><h3>Photo set karein</h3><div class=mu style="margin-bottom:8px">Ungli se khinch kar chehra beech mein layen, slider se zoom karein</div><canvas id=cv width=400 height=400 style="width:300px;max-width:100%;border-radius:12px;touch-action:none"></canvas><input type=range min=10 max=100 value="${CR.pct}" style="width:100%;margin:10px 0" oninput="CR.pct=+this.value;cdraw()"><div><button class="b p" onclick="csave()">Save</button> <button class=b onclick="M.style.display='none'">Raddi</button></div></div>`;
 M.style.display='flex';cdraw();
 const cv=$('#cv');let lx=null,ly;
 cv.onpointerdown=e=>{lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)};
 cv.onpointermove=e=>{if(lx==null)return;const k=CR.pct/100*CR.sh/cv.getBoundingClientRect().width;CR.cx-=(e.clientX-lx)*k;CR.cy-=(e.clientY-ly)*k;lx=e.clientX;ly=e.clientY;cdraw()};
 cv.onpointerup=cv.onpointercancel=()=>{lx=null};
}
function cdraw(f){const c=f||$('#cv'),im=CR.im,sz=CR.pct/100*CR.sh;
 CR.cx=Math.max(sz/2,Math.min(im.width-sz/2,CR.cx));CR.cy=Math.max(sz/2,Math.min(im.height-sz/2,CR.cy));
 c.getContext('2d').drawImage(im,CR.cx-sz/2,CR.cy-sz/2,sz,sz,0,0,c.width,c.height)}
function csave(){const c=document.createElement('canvas');c.width=c.height=400;cdraw(c);P(CR.id).pic=c.toDataURL('image/jpeg',.9);save();M.style.display='none';render();prof(CR.id)}

function need(){
 if(M.style.display=='flex')return;
 const m=cur();if(!m||m.done)return;const n=m.inn[m.inn.length-1];if(n.ended)return;
 const bp=bat(m,n),outs=n.balls.filter(b=>b.out).map(b=>b.bt);
 const av2=()=>bp.filter(id=>!outs.includes(id)&&id!=n.s&&id!=n.n);
 const pk=(t,l,f,skip)=>{M.innerHTML=`<div class=md><h3>${t}</h3>${l.map((id,i)=>`<button class=it onclick="PK(${i})">${av(id,28)}${nm(id)}</button>`).join('')}${skip?'<button class=it onclick="PK(-1)">Koi nahi</button>':''}</div>`;M.style.display='flex';window.PK=i=>{M.style.display='none';f(i<0?null:l[i]);save();render()}};
 if(!n.s){const a=av2();
  if(a.length)return pk('Naya batsman',a,id=>{n.s=id;if(n.sw){n.sw=0;if(n.n)[n.s,n.n]=[n.n,n.s]}});
  if(n.n){n.s=n.n;n.n=null;return render()}}
 if(n.s&&!n.n&&!n.balls.length&&!n.skipN&&av2().length)return pk('Non-striker',av2(),id=>{n.n=id;if(!id)n.skipN=1},1);
 if(!n.bw)return pk('Bowler',fld(m,n),id=>{n.bw=id});
}
function scorer(){
 const m=cur();if(!m){cm=null;return setupV()}
 if(m.done)return summary(m);
 const n=m.inn[m.inn.length-1],i=m.inn.length-1,t=tot(n),w=wk(n);
 let info=`${ovf(n)}/${m.ov} ov`;
 if(i==1){const tg=tot(m.inn[0])+1,need=tg-t,left=m.ov*6-lb(n);info+=` · Target ${tg} · ${need>0?need+' run, '+left+' ball baqi':'Poora'}`}
 let c=[],k=0;n.balls.forEach(b=>{c.push(b);if(!b.x&&++k%6==0)c=[]});
 const chip=b=>b.out?`<span class="ch o">W</span>`:b.x=='w'?`<span class=ch>Wd</span>`:b.x=='nb'?`<span class=ch>Nb${b.r||''}</span>`:`<span class="ch ${b.r>=4?'f':''}">${b.r}</span>`;
 const bl=id=>{if(!id)return '';const s=bs(n,id);return `<div class=row><span>${av(id,26)}${nm(id)}${id==n.s?' 🏏':''}</span><b>${s.r} <span class=mu>(${s.f})</span></b></div>`};
 const b=n.bw?bw(n,n.bw):null,pc=parts(n).cur,pr=n.s&&n.n?`<div class=row><span class=mu>Partnership</span><span>${pc.r} <span class=mu>(${pc.b})</span></span></div>`:'';
 return `<div class=mu onclick="back()" style="margin-bottom:8px">‹ Matches · ${m.t[0].n} vs ${m.t[1].n} <span style="float:right" onclick="event.stopPropagation();shareImg('${m.id}')">📤 Share</span></div>
 <div class=c><div class=mu>${m.t[n.bat].n} batting · Innings ${i+1}</div><div class=big>${t}/${w}</div><div class=mu style="margin-top:4px">${info}</div></div>
 ${n.ended?endBox(m,i):`<div class=c>${bl(n.s)}${bl(n.n)}${n.bw?`<div class=row><span class=mu>Bowler: ${nm(n.bw)}</span><span class=mu>${b.o}-${b.r}-${b.w}</span></div>`:''}${pr}<div style="margin-top:6px">${c.map(chip).join('')||'<span class=mu>Naya over</span>'}</div></div>
 <div class=g>${[0,1,2,3,4,6].map(r=>`<button class="${r>=4?'on':''}" onclick="ball(${r})">${r}</button>`).join('')}
 <button class="x ${nbOn?'on':''}" onclick="nbOn=!nbOn;render()">No ball</button><button class=x onclick="ball(0,'w')">Wide</button>
 <button class="w" onclick="ball(0,'',1)">OUT</button><button class="w x" onclick="ball(0,'',1,1)">Run out</button>
 <button class=x onclick="undo()">↩ Undo</button><button class=x onclick="retire()">🔄 Retire</button><button class=x style="grid-column:span 2" onclick="endInn()">Innings khatam</button></div>`}
 `;
}
function ball(r,x,out,ro){
 const m=cur(),n=m.inn[m.inn.length-1];if(n.ended||!n.s||!n.bw)return;
 if(nbOn&&!x){x='nb'}nbOn=false;
 if(x==='nb'&&out&&!ro){out=0;toast('No ball par out nahi: score count hua, ball nahi')}
 const b={bt:n.s,ns:n.n,bl:n.bw,r,x:x||'',xr:x?1:0,out:!!out,ro:!!ro,p:[n.s,n.n,n.bw,n.sw||0]};
 n.balls.push(b);
 if(r%2&&n.n&&!out)[n.s,n.n]=[n.n,n.s];
 const ov=!b.x&&lb(n)%6==0;
 if(ov){n.bw=null;if(out)n.sw=1;else if(n.n)[n.s,n.n]=[n.n,n.s]}
 if(out)n.s=null;
 const rem=bat(m,n).length-wk(n);
 if(out&&(rem==0||(rem==1&&!m.lm)))n.ended=1;
 if(lb(n)>=m.ov*6)n.ended=1;
 if(m.inn.length==2&&tot(n)>tot(m.inn[0]))n.ended=1;
 if(n.ended)fin(m);
 save();render();
}
function fin(m){
 if(m.inn.length<2)return;
 const a=tot(m.inn[0]),n=m.inn[1],b=tot(n);m.done=1;
 const rem=Math.max(bat(m,n).length-wk(n)-(m.lm?0:1),0);
 m.res=b>a?`${m.t[n.bat].n} ${rem} wicket se jeeta`:b<a?`${m.t[m.inn[0].bat].n} ${a-b} run se jeeta`:'Tie';
}
function undo(){
 const m=cur();let n=m.inn[m.inn.length-1];
 if(!n.balls.length){if(m.inn.length>1){m.inn.pop();n=m.inn[0]}else return}
 const b=n.balls.pop();[n.s,n.n,n.bw,n.sw]=b.p;n.ended=0;m.done=0;m.res='';M.style.display='none';save();render();
}
function endInn(){if(!confirm('Innings khatam karni hai?'))return;const m=cur(),n=m.inn[m.inn.length-1];n.ended=1;fin(m);save();render()}
function endBox(m,i){
 if(i==0)return `<div class=c><h3>Innings khatam: ${tot(m.inn[0])}/${wk(m.inn[0])}</h3><div class=mu style="margin-bottom:8px">${m.t[1-m.inn[0].bat].n} ko ${tot(m.inn[0])+1} run chahiye</div><button class="b p" onclick="inn2()">2nd innings shuru</button> <button class=b onclick="undo()">↩ Undo</button></div>`;
 return '';
}
function inn2(){const m=cur();m.inn.push({bat:1-m.inn[0].bat,balls:[],s:null,n:null,bw:null});save();render()}

function summary(m){
 const card=(n,i)=>{
  const ids=[];n.balls.forEach(b=>{[b.ns,b.bt].forEach(x=>x&&!ids.includes(x)&&ids.push(x))});
  const bo=[];n.balls.forEach(b=>!bo.includes(b.bl)&&bo.push(b.bl));
  return `<div class=c><h3>${m.t[n.bat].n}: ${tot(n)}/${wk(n)} (${ovf(n)})</h3>
  ${ids.map(id=>{const s=bs(n,id);return `<div class=row><span>${nm(id)}${s.o?'':'*'}</span><span>${s.r} (${s.f})</span></div>`}).join('')}
  <div class=mu style="margin:8px 0 2px">Bowling</div>
  ${bo.map(id=>{const s=bw(n,id);return `<div class=row><span>${nm(id)}</span><span>${s.o}-${s.r}-${s.w}</span></div>`}).join('')}${pHtml(n)}</div>`};
 return `<div class=mu onclick="back()" style="margin-bottom:8px">‹ Matches</div><div class=c><h3>${m.res}</h3><div class=mu>${new Date(m.d).toLocaleDateString()} · ${m.ov} overs</div></div>${m.inn.map(card).join('')}
 <button class="b p" onclick="shareImg('${m.id}')">📤 Scorecard image share</button> <button class=b onclick="undo()">↩ Aakhri ball undo</button> <button class=b style="color:#f88" onclick="if(confirm('Match delete?')){D.m=D.m.filter(x=>x.id!=cm);cm=null;save();render()}">Match delete</button>`;
}

function render(){
 $('#tabs').innerHTML=[['match','🏏 Match'],['tn','🏆 Tournament'],['pl','👥 Players'],['st','📊 Stats']].map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';M.style.display='none';render()">${t[1]}</button>`).join('');
 $('#app').innerHTML=(tab=='match'?(cm?scorer():setupV()):tab=='tn'?tnV():tab=='pl'?playersV():statsV(null))+'<div class=mu style="text-align:center;margin:18px 0 6px">🏏 SadCricScorer · Developed by Sadiq Ahmad</div>';
 if(tab=='match'&&cm)need();
}
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
